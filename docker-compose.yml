version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    ports:
      - "5000:8080"
    volumes:
      - ./src:/app/src
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
      - redis
    working_dir: /app/src/API
    command: ["dotnet", "watch", "run", "--no-launch-profile", "--urls=http://0.0.0.0:8080"]

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: uala
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres-data:
